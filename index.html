<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alltag">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Mein Alltag</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: kopfzeile mit grossem Titel, Inhalt als Karten, feste Tab-Leiste unten, runder Plus-Knopf, Bottom-Sheet zum Erfassen */
:root{--bg:#f8f5f0;--card:#fffdfa;--text:#2e2924;--muted:#8a8076;--accent:#8c6d3f;--on-accent:#fff;--soft:#f3e9d6;--line:#ece5da;--red:#c9645a;--amber:#d09a3c;--green:#3f9468;--shadow:0 1px 2px rgba(80,60,30,.05),0 8px 22px rgba(80,60,30,.06);--safe-top:env(safe-area-inset-top,0px);--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1815;--card:#252019;--text:#f1eadf;--muted:#a59b8e;--line:#39322a;--accent:#cfae72;--on-accent:#1f1a14;--soft:#3a3227;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1815;--card:#252019;--text:#f1eadf;--muted:#a59b8e;--line:#39322a;--accent:#cfae72;--on-accent:#1f1a14;--soft:#3a3227;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:inline-block;vertical-align:-.2em;flex:none}

/* Kopf */
#top{padding-top:calc(var(--safe-top) + 16px);padding-bottom:4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
#top>div:first-child{min-width:0}
h1{margin:0;font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.1;letter-spacing:.01em}
.sub{color:var(--muted);font-size:14px;letter-spacing:.03em}
.back{border:0;background:none;color:var(--accent);padding:4px 0;display:inline-flex;align-items:center;gap:2px;font-size:15px}
.tact{border:0;background:var(--card);color:var(--muted);box-shadow:var(--shadow);border-radius:12px;padding:9px 12px;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.tact.danger{color:var(--red)}

/* Abschnitte und Karten */
.sec{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.link{border:0;background:none;color:var(--accent);font-size:14px;padding:2px 0}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.hero{background:var(--soft);box-shadow:none}
.hero b{font-family:var(--serif);font-size:24px;font-weight:600;display:block;line-height:1.2}
.hero small{display:block;color:var(--muted);margin:2px 0 12px}
.prog{height:8px;border-radius:99px;background:var(--card);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.empty b{display:block;color:var(--text);font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:2px}

/* Aufgaben */
.item{display:flex;gap:12px;align-items:center;background:var(--card);padding:12px 14px 12px 12px;border-radius:18px;margin:8px 0;box-shadow:var(--shadow);border-left:4px solid var(--line)}
.p1{border-left-color:var(--red)}.p2{border-left-color:var(--amber)}
.tx{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:block}
.tx>span:first-child{display:block;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center;font-size:12px;color:var(--muted);margin-top:1px}
.meta i{font-style:normal;opacity:.5}
.meta .over{color:var(--red);font-weight:600}
.done .tx>span:first-child{text-decoration:line-through;color:var(--muted)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;color:#fff;display:grid;place-items:center;padding:0}
.done .chk{background:var(--green);border-color:var(--green)}
.seg{display:flex;gap:4px;background:var(--line);border-radius:14px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px 4px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#t-chips{flex-wrap:wrap;overflow:visible;padding-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.clear{display:block;margin:14px auto;border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px}

/* Gewohnheiten */
.hab{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin:10px 0}
.hab .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hab .top button.name{border:0;background:none;padding:0;text-align:left;font-weight:600;min-width:0;word-break:break-word}
.streak{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--amber);font-weight:600;white-space:nowrap}
.days{display:flex;justify-content:space-between;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;display:grid;place-items:center;padding:0}
.day button.on{background:var(--green);border-color:var(--green)}
.day.today span{color:var(--accent);font-weight:700}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;box-shadow:var(--shadow)}
.hchip.on{background:var(--green);border-color:var(--green);color:#fff}
.hchip small{display:inline-flex;align-items:center;gap:2px;opacity:.85}

/* Woche */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 0}
.wk-nav button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;width:44px;height:40px;display:grid;place-items:center;color:var(--text)}
.wk-nav b{flex:1;text-align:center;font-size:15px}
.wday h3{margin:20px 0 2px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-weight:600}
.wday.today h3{color:var(--accent)}
.wday.over h3{color:var(--red)}
.wday .none{color:var(--muted);font-size:13px;padding:4px 2px}
.wadd{border:0;background:none;color:var(--accent);font-size:14px;padding:6px 2px}
.wform input{width:100%;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:6px 0}

/* Listen (Mehr, Einkauf, Notizen) */
.rows{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:15px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ri{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt small{display:block;color:var(--muted);font-size:13px}
.row .chev{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin-top:8px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red)}
.note-msg{font-size:14px;margin-top:10px;color:var(--muted)}
.sform{display:flex;gap:8px;margin:12px 0 4px}
.sform input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sform button{border:0;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:0 16px;display:grid;place-items:center}
.nrow{display:block;width:100%;text-align:left;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:13px 14px;margin:8px 0}
.nrow b{display:block;word-break:break-word}
.nrow span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow small{font-size:11px;color:var(--muted)}
#nsearch{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:10px 0 4px}
#ntext{display:block;width:100%;min-height:58vh;resize:none;line-height:1.55;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px;box-shadow:var(--shadow)}
#btext{width:100%;min-height:120px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}

/* Schnelleingabe */
.qadd{display:flex;gap:8px;margin:12px 0}
.qadd input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow)}
.qadd input:focus{border-color:var(--accent);outline:none}
.qadd button{border:0;background:var(--accent);color:var(--on-accent);border-radius:16px;width:50px;display:grid;place-items:center;flex:none}
.qprev{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.qprev:empty{display:none}
.qp{background:var(--soft);border-radius:99px;padding:4px 11px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.qp.t{background:none;border:1px solid var(--line);color:var(--muted)}

/* Tagesrueckblick */
.focus{border-left:4px solid var(--accent);margin:0 0 12px}
.focus small{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.focus b{display:block;margin-top:2px;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25}
.rvp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;margin:12px 0 0;background:var(--soft);box-shadow:none;color:var(--text)}
.rvp .ri{width:38px;height:38px;border-radius:12px;background:var(--card);color:var(--accent);display:grid;place-items:center;flex:none}
.rvp .rt{flex:1;min-width:0}.rvp .rt small{display:block;color:var(--muted);font-size:13px}
.rvrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:12px 12px 12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.rvrow .rvt{flex:1;min-width:0;word-break:break-word}
.rvb{display:flex;gap:6px;flex:none}
.rvb button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.rvb .g{color:var(--green)}.rvb .r{color:var(--red)}
.rvdone{display:flex;gap:8px;align-items:center;padding:6px 2px;color:var(--muted);font-size:14px}
.rvdone svg{color:var(--green);flex:none}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 0;font-size:18px;font-family:var(--serif);font-weight:600;box-shadow:var(--shadow)}
.mood button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.moodl{text-align:center;color:var(--muted);font-size:13px;margin-top:6px;min-height:20px}
.ta{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;line-height:1.45;box-shadow:var(--shadow)}
.ta:focus{border-color:var(--accent);outline:none}
.hrow{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;margin:8px 0}
.hrow .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow .hd b{font-family:var(--serif);font-size:19px;font-weight:600}
.hrow p{margin:4px 0 0;font-size:14px;word-break:break-word}
.hrow p span{color:var(--muted)}
.hrow .x{border:0;background:none;color:var(--muted);padding:2px}

h1,.hero b,.focus b,.mood button,.shead b,.hrow .hd b,.empty b{font-variant-numeric:lining-nums}

/* Auswertung der Gewohnheiten */
.hnum{font-size:48px;font-weight:600;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.hnum span{font-size:22px;font-weight:500;margin-left:2px;color:var(--muted)}
.bars{display:flex;gap:8px;margin-top:16px}
.bcol{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.btrack{display:flex;align-items:flex-end;justify-content:center;width:100%;height:84px;border-bottom:1px solid var(--line)}
.btrack i{display:block;width:100%;max-width:24px;background:var(--green);border-radius:4px 4px 0 0}
.blab{font-size:11px;color:var(--muted)}
.bcol.today .blab{color:var(--accent);font-weight:700}
.bcol.dim .btrack i{background:var(--muted);opacity:.38}
.bval{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;min-height:14px}
.tip{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 13px;min-width:0}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;margin-top:2px;font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:lining-nums}
.tile b span{font-size:13px;font-weight:500;color:var(--muted)}
.hmap{display:grid;grid-template-columns:20px repeat(12,1fr);gap:3px;align-items:center}
.hmm{font-size:11px;color:var(--muted);white-space:nowrap;align-self:end;padding-bottom:2px}
.hmw{font-size:11px;color:var(--muted)}
.hm{display:block;width:100%;aspect-ratio:1;border:0;padding:0;border-radius:5px;background:var(--line)}
.hm.on{background:var(--green)}
.hm.pre{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hm.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line);opacity:.45}
.hm.td{outline:2px solid var(--accent);outline-offset:1px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;background:var(--line);display:inline-block}
.sw.on{background:var(--green)}
.cap{font-size:13px;color:var(--muted);margin:2px 0 0}
details.tbl{margin-top:16px}
details.tbl summary{cursor:pointer;color:var(--accent);font-size:14px;padding:6px 0}
details.tbl table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
details.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
details.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hab .foot{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.hab .foot i{font-style:normal;opacity:.5}
.hab .chartb{border:0;background:var(--bg);color:var(--muted);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.hab .top{align-items:center}
.hab .tr{display:flex;align-items:center;gap:8px}

/* Projekte und Teilschritte */
.pcard{display:block;width:100%;text-align:left;border:0;margin:10px 0;color:var(--text)}
.phd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.phd b{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.2;word-break:break-word;font-variant-numeric:lining-nums}
.pcard .prog{background:var(--line);margin-top:10px}
.pnext{margin-top:8px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnote{margin:12px 0 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.subrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.subrow span{flex:1;min-width:0;word-break:break-word}
.subrow.done span{text-decoration:line-through;color:var(--muted)}
.chk.sm{width:22px;height:22px}
.subx{border:0;background:none;color:var(--muted);padding:2px;display:grid;place-items:center}
#t-subadd{margin-top:4px}

/* Einkauf: Mengen, Bereiche, Rezepte */
.amt{flex:none;font-size:13px;font-weight:600;background:var(--soft);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.shcat{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 2px 2px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:-2px 2px 6px}
.item.pn{flex-wrap:wrap;row-gap:8px}
.pan{display:flex;gap:8px;flex-basis:100%;justify-content:flex-end}
.pan button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--text)}
.pan .miss{color:var(--red)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.sug:empty{display:none}
.sug button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--text)}
.sug button small{color:var(--muted);margin-left:5px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 4px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.stepper b{min-width:130px;text-align:center;font-size:18px;font-variant-numeric:lining-nums}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.rrow .rn{word-break:break-word}
.rrow .ra{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ing{display:grid;grid-template-columns:76px 74px 1fr auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.panel .ing input,.panel .ing select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 4px 8px 8px;font-size:14px}
.ing .iname{word-break:break-word;font-size:15px}
.ing .pv{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 8px;font-size:12px;color:var(--text)}
.ing .pv.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.ing .ix{border:0;background:none;color:var(--muted);padding:2px;display:grid;place-items:center}
.panel input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.two3{display:grid;grid-template-columns:90px 1fr auto;gap:8px;margin-top:8px}
.two3 .btn{margin:0;width:auto;padding:0 16px}

/* Hinweis (Erinnerung) */
#banner{margin-top:6px}
.al{display:flex;gap:8px;align-items:center;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0}
.al .at{flex:1;min-width:0;word-break:break-word;display:flex;gap:8px;align-items:center}
.al .at svg{color:var(--accent)}
.al button{border:0;border-radius:10px;padding:7px 11px;background:var(--card);color:var(--accent);box-shadow:var(--shadow);font-size:14px}
#perm{border:0;background:none;color:var(--accent);font-size:14px;padding:6px 0;display:inline-flex;gap:6px;align-items:center}

/* Tab-Leiste und Plus-Knopf */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(80,60,30,.06);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
#bar button{flex:1;min-width:0;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:10.5px;letter-spacing:.01em;position:relative}
#bar button.on{color:var(--accent);font-weight:600}
#bar .dot{position:absolute;top:7px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
#fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px rgba(80,60,30,.3)}
#fab:active{transform:scale(.95)}

/* Rueckgaengig */
#toast{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast button{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 4px}
:root:not([data-theme="dark"]) #toast button{color:#e3c98f}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet .bd{position:absolute;inset:0;background:rgba(30,24,16,.4)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .24s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}.prog i{transition:none}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shead b{font-family:var(--serif);font-size:24px;font-weight:600}
.shead button{border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
.panel input[type=text],.panel input[type=date],.panel input[type=time],.panel select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
#t-title,#h-name{font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;margin-top:20px}
.acts button{flex:1;border-radius:14px;padding:13px;border:1px solid var(--line);background:var(--bg)}
.acts .ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;flex:2}
.acts .del{color:var(--red)}
</style>
</head>
<body>
<header id="top" class="wrap"><div><div id="crumb"></div><h1 id="h1"></h1><div class="sub" id="sub"></div></div><div id="topact"></div></header>
<div id="banner" class="wrap"></div>
<main id="view" class="wrap"></main>
<button id="fab" aria-label="Neu"></button>
<nav id="bar" aria-label="Hauptmenü"></nav>
<div id="toast" class="" hidden><span id="tmsg"></span><button id="tundo">Rückgängig</button></div>

<div id="sheet" hidden>
  <div class="bd" data-close="1"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="grab"></div>
    <div class="shead"><b id="sh-title">Neue Aufgabe</b><button type="button" data-close="1" aria-label="Schließen" id="sh-x"></button></div>
    <form id="tform" autocomplete="off">
      <input id="t-title" type="text" placeholder="Was steht an?" required>
      <div class="lbl">Wann</div>
      <div class="chips" id="t-chips">
        <button type="button" class="chip" data-dc="today">Heute</button>
        <button type="button" class="chip" data-dc="tomorrow">Morgen</button>
        <button type="button" class="chip" data-dc="week">Nächste Woche</button>
        <button type="button" class="chip" data-dc="none">Kein Datum</button>
      </div>
      <div class="two"><input id="t-date" type="date" aria-label="Datum"><input id="t-time" type="time" aria-label="Uhrzeit"></div>
      <div class="lbl">Erinnerung</div>
      <select id="t-rem" aria-label="Erinnerung"><option value="">Keine Erinnerung</option><option value="0">Zur eingestellten Zeit</option><option value="10">10 Minuten vorher</option><option value="60">1 Stunde vorher</option></select>
      <div class="lbl">Wichtigkeit</div>
      <div class="seg" id="t-prio" style="margin:0"><button type="button" data-sp="3">Normal</button><button type="button" data-sp="2">Wichtig</button><button type="button" data-sp="1">Dringend</button></div>
      <div class="two" style="margin-top:16px">
        <div><div class="lbl" style="margin-top:0">Bereich</div><select id="t-cat" aria-label="Bereich"><option>Privat</option><option>Arbeit</option><option>Haushalt</option><option>Gesundheit</option><option>Einkauf</option></select></div>
        <div><div class="lbl" style="margin-top:0">Wiederholen</div><select id="t-rep" aria-label="Wiederholen"><option value="">Einmalig</option><option value="daily">Täglich</option><option value="weekly">Wöchentlich</option><option value="monthly">Monatlich</option></select></div>
      </div>
      <div class="lbl">Projekt</div>
      <select id="t-proj" aria-label="Projekt"></select>
      <div class="lbl">Teilschritte</div>
      <div id="t-subs"></div>
      <input id="t-subadd" type="text" placeholder="Teilschritt hinzufügen" enterkeyhint="done" autocomplete="off">
      <div class="acts"><button type="button" class="del" id="t-del" data-tdel="1">Löschen</button><button type="submit" class="ok">Speichern</button></div>
    </form>
    <form id="rform" autocomplete="off" hidden>
      <input id="r-name" type="text" placeholder="Rezeptname, z. B. Tomatensuppe" required>
      <div class="lbl">Portionen</div>
      <input id="r-port" type="number" min="1" max="50" inputmode="numeric" value="2" aria-label="Portionen">
      <div class="lbl">Zutaten</div>
      <p class="hint" style="margin:0 0 6px">„Kaufen“ heißt: unbedingt besorgen. „Vorrat“ heißt: hast du wahrscheinlich zu Hause.</p>
      <div id="r-ings"></div>
      <input id="r-iname" type="text" placeholder="Zutat suchen oder eintippen, z. B. Tomate" aria-label="Zutat" style="margin-top:10px" enterkeyhint="done">
      <div class="sug" id="r-sug"></div>
      <div class="two3"><input id="r-iq" type="number" step="any" inputmode="decimal" placeholder="Menge" aria-label="Menge"><select id="r-iu" aria-label="Einheit"></select><button type="button" class="btn main" id="r-iadd" data-radd="1">Hinzufügen</button></div>
      <div class="lbl">Zubereitung (optional)</div>
      <textarea id="r-note" class="ta" rows="4" placeholder="Kurze Notizen zum Rezept" aria-label="Zubereitung"></textarea>
      <div class="acts"><button type="button" class="del" id="r-del" data-rdel="1">Löschen</button><button type="submit" class="ok">Speichern</button></div>
    </form>
    <form id="pform" autocomplete="off" hidden>
      <input id="p-name" type="text" placeholder="Projektname, z. B. Umzug" required>
      <div class="lbl">Notiz</div>
      <textarea id="p-note" class="ta" rows="3" placeholder="Worum geht es?" aria-label="Notiz"></textarea>
      <div class="lbl">Fällig bis</div>
      <input id="p-due" type="date" aria-label="Fällig bis">
      <div class="acts"><button type="button" class="del" id="p-del" data-pdel="1">Löschen</button><button type="submit" class="ok">Speichern</button></div>
    </form>
    <form id="hform" autocomplete="off" hidden>
      <input id="h-name" type="text" placeholder="z. B. Wasser trinken" required>
      <div class="acts"><button type="button" class="del" id="h-del" data-hdel="1">Löschen</button><button type="submit" class="ok">Speichern</button></div>
    </form>
  </div>
</div>
<input type="file" id="bfile" accept="application/json,.json" hidden>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* ---------- Icons ---------- */
const P={
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.5 5M3.5 12l1.2 1.2L6.5 11M3.5 18l1.2 1.2L6.5 17"/>',
cal:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3"/>',
repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/>',
more:'<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
bell:'<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
chevL:'<path d="M15 5l-7 7 7 7"/>',
chevR:'<path d="M9 5l7 7-7 7"/>',
flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2 1-3.2 2-4.2.3 1.5 1 2.2 2 2.2 0-3-1-5 1-8z"/>',
cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2.5l2 11h11l2-8H6.5"/>',
note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
down:'<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>',
up:'<path d="M12 16V4M7 8l5-5 5 5M4 20h16"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
home:'<path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/>',
folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
chart:'<path d="M5 20v-7M12 20V5M19 20v-11"/>',
moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
book:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/>'
};
function ic(n,s=22,w=1.8){return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`}

/* ---------- Daten ---------- */
const K={t:'alltag.tasks.v1',h:'alltag.habits.v1',s:'alltag.shop.v1',n:'alltag.notes.v1',r:'alltag.reviews.v1',p:'alltag.projects.v1',x:'alltag.recipes.v1',b:'alltag.backup.v1'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tasks=load(K.t,[]),habits=load(K.h,[]),shop=load(K.s,[]),notes=load(K.n,[]),reviews=load(K.r,[]),projects=load(K.p,[]),recipes=load(K.x,[]);
const saveT=()=>put(K.t,tasks),saveH=()=>put(K.h,habits),saveS=()=>put(K.s,shop),saveN=()=>put(K.n,notes);
const saveR=()=>put(K.r,reviews);
const saveP=()=>put(K.p,projects),saveX=()=>put(K.x,recipes);
const saveAll=()=>{saveT();saveH();saveS();saveN();saveR();saveP();saveX()};
function projOf(id){return projects.find(p=>p.id===id)}
function projStats(p){const l=tasks.filter(t=>t.proj===p.id);const done=l.filter(t=>t.done).length;return{total:l.length,done,open:l.length-done}}
const lastBackup=()=>{try{return +localStorage.getItem(K.b)||0}catch(e){return 0}};
const markBackup=()=>{try{localStorage.setItem(K.b,String(Date.now()))}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- Hilfen ---------- */
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
function addDays(d,n){const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(d){const t=today();if(d===t)return 'Heute';if(d===addDays(t,1))return 'Morgen';if(d===addDays(t,-1))return 'Gestern';return new Date(d+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}
const REPN={daily:'Täglich',weekly:'Wöchentlich',monthly:'Monatlich'};
const hasRem=x=>x.rem!==undefined&&x.rem!==null&&x.rem!=='';
const sortT=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99')||(a.prio-b.prio);
function nextDate(d,r){
  const x=new Date(d+'T00:00');
  if(r==='daily')x.setDate(x.getDate()+1);
  else if(r==='weekly')x.setDate(x.getDate()+7);
  else{const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  return iso(x);
}
function toggleTask(id){
  const x=tasks.find(t=>t.id==id);if(!x)return;
  x.done=!x.done;
  if(x.done){
    x.doneAt=Date.now();
    if(x.rep){
      let d=nextDate(x.date||today(),x.rep);
      while(d<=today())d=nextDate(d,x.rep);
      const n={id:Date.now(),title:x.title,date:d,time:x.time||'',rem:x.rem,reminded:false,prio:x.prio,cat:x.cat,rep:x.rep,proj:x.proj||'',sub:(x.sub||[]).map(z=>({...z,done:false})),done:false};
      x.next=n.id;tasks.push(n);
    }
  }else{
    delete x.doneAt;
    if(x.next){const n=tasks.find(t=>t.id===x.next);if(n&&!n.done)tasks=tasks.filter(t=>t!==n);delete x.next}
  }
  saveT();
}
function streak(h){let d=today();if(!h.days.includes(d))d=addDays(d,-1);let n=0;while(h.days.includes(d)){n++;d=addDays(d,-1)}return n}

/* ---------- Rueckgaengig ---------- */
let undoSnap=null,toastTimer=null;
const snap=()=>JSON.stringify({tasks,habits,shop,notes,reviews,projects,recipes});
function toast(msg){
  undoSnap=snap.last||null;
  $('tmsg').textContent=msg;$('toast').hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true},6000);
}
function destructive(msg,fn){snap.last=snap();fn();render();toast(msg)}
$('tundo').addEventListener('click',()=>{
  if(!undoSnap)return;
  const o=JSON.parse(undoSnap);tasks=o.tasks;habits=o.habits;shop=o.shop;notes=o.notes;reviews=o.reviews||[];projects=o.projects||[];recipes=o.recipes||[];saveAll();
  undoSnap=null;$('toast').hidden=true;checkReminders();render();
});

/* ---------- Erinnerungen ---------- */
let alerts=[],permBlocked=false;
function notify(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const fb=()=>{try{new Notification(title,{body,tag})}catch(e){}};
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
      navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification?r.showNotification(title,{body,tag,icon:'icons/icon-192.png'}):fb()).catch(fb);
    else fb();
  }catch(e){}
}
function notifState(){try{return 'Notification' in window?Notification.permission:'unsupported'}catch(e){return 'unsupported'}}
function renderBanner(){
  const items=alerts.map(id=>tasks.find(t=>t.id===id)).filter(x=>x&&!x.done);
  alerts=items.map(x=>x.id);
  let h=items.map(x=>`<div class="al"><div class="at">${ic('bell',18)}<span><b>${x.time||''}</b> ${esc(x.title)}</span></div><button data-asnz="${x.id}">+10 Min</button><button data-aok="${x.id}">OK</button></div>`).join('');
  if(!permBlocked&&notifState()==='default'&&hasAnyRem())h+=`<button id="perm" data-perm="1">${ic('bell',16)} Benachrichtigungen aktivieren</button>`;
  $('banner').innerHTML=h;
}
const hasAnyRem=()=>tasks.some(x=>!x.done&&hasRem(x));
function checkReminders(){
  const now=Date.now();let ch=false;
  tasks.forEach(x=>{
    if(x.done||!hasRem(x)||x.reminded||!x.date||!x.time)return;
    const due=new Date(x.date+'T'+x.time).getTime()-(+x.rem)*60000;
    if(Math.max(due,x.snoozeUntil||0)<=now){
      x.reminded=true;ch=true;
      if(!alerts.includes(x.id))alerts.push(x.id);
      notify(x.rem==='0'?'Jetzt: '+x.title:'Gleich: '+x.title,(x.time||'')+(x.cat?' · '+x.cat:''),'t'+x.id);
    }
  });
  if(ch)saveT();
  renderBanner();
}

/* ---------- Sicherung ---------- */
let pendingImport=null,backupMsg='',backupText='';
function backupDue(){const n=tasks.length+habits.length+shop.length+notes.length+reviews.length+projects.length+recipes.length;const l=lastBackup();return n>=5&&(!l||Date.now()-l>14*864e5)}
function backupJSON(){return JSON.stringify({app:'alltag',version:2,exported:new Date().toISOString(),data:{tasks,habits,shop,notes,reviews,projects,recipes}},null,1)}
function downloadBackup(){
  const json=backupJSON();
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download='alltag-sicherung-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    markBackup();backupMsg='Sicherung erstellt. Die Datei liegt in deinen Downloads.';
  }catch(e){backupMsg='Das Herunterladen hat nicht geklappt. Nutze „Als Text kopieren“.'}
  render();
}
function copyBackup(){
  const json=backupJSON();
  const fallback=()=>{backupText=json;backupMsg='Kopieren war nicht möglich. Markiere den Text unten und kopiere ihn von Hand.';render()};
  try{navigator.clipboard.writeText(json).then(()=>{markBackup();backupText='';backupMsg='Sicherung in die Zwischenablage kopiert. Füge sie z. B. in eine Notiz oder Mail ein.';render()}).catch(fallback)}catch(e){fallback()}
}
function readBackup(text){
  try{
    const o=JSON.parse(text);const d=o&&o.data?o.data:o;
    const ok=k=>Array.isArray(d[k]);
    if(!d||!ok('tasks')||!ok('habits')||!ok('shop')||!ok('notes'))throw 0;
    if(!Array.isArray(d.reviews))d.reviews=[];
    if(!Array.isArray(d.projects))d.projects=[];
    if(!Array.isArray(d.recipes))d.recipes=[];
    pendingImport={d,exported:o.exported||''};backupMsg='';
  }catch(e){pendingImport=null;backupMsg='Diese Datei ist keine gültige Sicherung.'}
  render();
}
$('bfile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>readBackup(String(r.result));r.onerror=()=>{backupMsg='Die Datei konnte nicht gelesen werden.';render()};r.readAsText(f);e.target.value='';
});
function applyImport(){
  if(!pendingImport)return;
  const d=pendingImport.d;pendingImport=null;
  snap.last=snap();
  tasks=d.tasks;habits=d.habits;shop=d.shop;notes=d.notes;reviews=d.reviews||[];projects=d.projects||[];recipes=d.recipes||[];saveAll();alerts=[];
  backupMsg='Sicherung eingespielt.';render();toast('Daten ersetzt');checkReminders();
}

/* ---------- Navigation ---------- */

/* ---------- Schnelleingabe: Satz -> Aufgabe ---------- */
const WD=['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
const MONTHS={januar:1,jan:1,februar:2,feb:2,märz:3,mär:3,mrz:3,april:4,apr:4,mai:5,juni:6,jun:6,juli:7,jul:7,august:8,aug:8,september:9,sept:9,sep:9,oktober:10,okt:10,november:11,nov:11,dezember:12,dez:12};
const NUMW={ein:1,einem:1,einer:1,eine:1,einen:1,zwei:2,drei:3,vier:4,fünf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10};
const CATKW=[['Gesundheit',['arzt','apotheke','tablette','medikament','sport','training','yoga','laufen','physio','impf']],['Arbeit',['arbeit','büro','meeting','chef','kunde','bericht','projekt','präsentation']],['Haushalt',['putzen','wäsche','waschen','müll','aufräumen','spülmaschine','staubsaug']],['Einkauf',['einkauf','kaufen','besorgen','supermarkt']]];
function parseQuick(text,nowD){
  const now=nowD||new Date(),t0=iso(now);
  let s=' '+String(text)+' ';
  const o={title:'',date:'',time:'',rem:'',prio:3,cat:'',rep:'',proj:'',guessed:false};
  const take=(src,ok)=>{
    const re=new RegExp('(^|[^\\p{L}\\d])(?:'+src+')(?![\\p{L}\\d])','iu');
    const m=s.match(re);if(!m)return null;
    if(ok&&!ok(m))return null;
    s=s.slice(0,m.index)+m[1]+' '+s.slice(m.index+m[0].length);return m;
  };
  const WDS='montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag';
  const nextWd=(idx,strict)=>{for(let i=strict?1:0;i<=7;i++){const d=addDays(t0,i);if(new Date(d+'T00:00').getDay()===idx)return d}return t0};
  const num=w=>/^\d+$/.test(w)?+w:(NUMW[w.toLowerCase()]||0);
  let m;
  // Wiederholung
  if(m=take('jeden\\s+('+WDS+')')){o.rep='weekly';o.date=nextWd(WD.indexOf(m[2].toLowerCase()),true)}
  else if(take('jeden\\s+tag|täglich'))o.rep='daily';
  else if(take('jede\\s+woche|wöchentlich'))o.rep='weekly';
  else if(take('jeden\\s+monat|monatlich'))o.rep='monthly';
  // Erinnerung, Wichtigkeit
  if(take('mit\\s+erinnerung|erinnere\\s+mich(?:\\s+daran)?|erinnerung|erinnern|erinner\\w*'))o.rem='0';
  if(take('dringend'))o.prio=1;else if(take('wichtig'))o.prio=2;
  // Uhrzeit
  const setT=(h,mi)=>{o.time=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')};
  const okT=(h,mi)=>h>=0&&h<24&&mi>=0&&mi<60;
  if(m=take('(?:um\\s+)?(\\d{1,2})[:.](\\d{2})\\s*uhr',x=>okT(+x[2],+x[3])))setT(+m[2],+m[3]);
  else if(m=take('(?:um\\s+)?(\\d{1,2}):(\\d{2})',x=>okT(+x[2],+x[3])))setT(+m[2],+m[3]);
  else if(m=take('(?:um\\s+)?(\\d{1,2})\\s*uhr',x=>okT(+x[2],0)))setT(+m[2],0);
  else if(m=take('um\\s+(\\d{1,2})',x=>okT(+x[2],0)))setT(+m[2],0);
  // Datum
  const mk=(d,mo,y)=>{
    let yr=y?(y<100?2000+y:y):now.getFullYear();
    let dt=new Date(yr,mo-1,d);if(dt.getMonth()!==mo-1||dt.getDate()!==d)return '';
    let r=iso(dt);if(!y&&r<t0){dt=new Date(yr+1,mo-1,d);if(dt.getMonth()!==mo-1)return '';r=iso(dt)}
    return r;
  };
  let dm=null;
  if(!o.date){
    if(m=take('(\\d{1,2})\\.(\\d{1,2})(?:\\.(\\d{4}|\\d{2})?)?',x=>!!mk(+x[2],+x[3],x[4]?+x[4]:0)))o.date=mk(+m[2],+m[3],m[4]?+m[4]:0);
    else if(m=take('(\\d{1,2})\\.?\\s*('+Object.keys(MONTHS).join('|')+')',x=>!!mk(+x[2],MONTHS[x[3].toLowerCase()],0)))o.date=mk(+m[2],MONTHS[m[3].toLowerCase()],0);
    else if(take('übermorgen'))o.date=addDays(t0,2);
    else if(take('morgen'))o.date=addDays(t0,1);
    else if(take('heute|heut'))o.date=t0;
    else if(m=take('in\\s+(\\d+|'+Object.keys(NUMW).join('|')+')\\s+(tag|tage|tagen|woche|wochen|monat|monate|monaten)',x=>num(x[2])>0)){
      const n=num(m[2]),u=m[3].toLowerCase();
      if(u.startsWith('tag'))o.date=addDays(t0,n);
      else if(u.startsWith('woche'))o.date=addDays(t0,7*n);
      else{const d=new Date(t0+'T00:00');d.setMonth(d.getMonth()+n);o.date=iso(d)}
    }
    else if(take('(?:nächste[nrms]?|kommende[nrms]?)\\s+woche'))o.date=nextWd(1,true);
    else if(m=take('(?:am\\s+|nächste[nrms]?\\s+|kommende[nrms]?\\s+)?('+WDS+')'))o.date=nextWd(WD.indexOf(m[2].toLowerCase()),true);
    else if(take('(?:am\\s+|dieses\\s+)?wochenende')){const d=new Date(t0+'T00:00').getDay();o.date=d===0?t0:nextWd(6,false)}
  }
  // Tageszeit
  if(m=take('morgens|vormittags|mittags|nachmittags|abends')){
    const w=m[0].replace(/[^\p{L}]/gu,'').toLowerCase();
    if(o.time){if((w==='nachmittags'||w==='abends')&&+o.time.slice(0,2)<12)setT(+o.time.slice(0,2)+12,+o.time.slice(3))}
    else setT({morgens:8,vormittags:10,mittags:12,nachmittags:15,abends:19}[w],0);
  }
  // Bereich per #Tag
  if(m=take('#(\\p{L}+)')){const c=['Privat','Arbeit','Haushalt','Gesundheit','Einkauf'].find(x=>x.toLowerCase().startsWith(m[2].toLowerCase()));if(c)o.cat=c;else{const w=m[2].toLowerCase(),pr=projects.find(x=>!x.closed&&x.name.toLowerCase().split(/[^\p{L}\d]+/u).some(wd=>wd&&wd.startsWith(w)));if(pr)o.proj=pr.id}}
  // Titel bereinigen
  let t=s.replace(/\s+/g,' ').trim();
  const lead=/^(am|um|bis|für|ab|den|dem|in|jeden|und|noch|mal|:|,|;|-)\s+/i,trail=/\s+(am|um|bis|für|ab|den|dem|in|und|:|,|;|-)$/i;
  for(let i=0;i<6;i++){t=t.replace(lead,'').replace(trail,'').replace(/^[:,;\-\s]+|[:,;\-\s]+$/g,'')}
  if(!t)t=String(text).trim();
  o.title=t.charAt(0).toUpperCase()+t.slice(1);
  if(!o.cat){const low=o.title.toLowerCase();for(const[c,ks]of CATKW){if(ks.some(k=>low.includes(k))){o.cat=c;break}}}
  if(!o.cat)o.cat='Privat';
  if(o.rem!==''&&!o.time)o.time='09:00';
  if(o.time&&!o.date){
    const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    o.date=o.time>hhmm?t0:addDays(t0,1);o.guessed=true;
  }
  if(o.rem!==''&&!o.date)o.date=t0;
  return o;
}

/* ---------- Gewohnheiten ---------- */
/* Berechnung */
const WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],WDS2=['Mo','Di','Mi','Do','Fr','Sa','So'];
const dowIdx=d=>(new Date(d+'T00:00').getDay()+6)%7;
const fmtFull=d=>new Date(d+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
function habitStart(h){const a=[];if(h.id>1e12)a.push(iso(new Date(h.id)));if(h.days.length)a.push([...h.days].sort()[0]);return a.sort()[0]||''}
function habitRate(h,n){
  const st=habitStart(h);if(!st)return null;const set=new Set(h.days);let tot=0,done=0;
  for(let i=0;i<n;i++){const d=addDays(today(),-i);if(d<st)break;tot++;if(set.has(d))done++}
  return tot?{pct:Math.round(done/tot*100),done,tot}:null;
}
function longestStreak(h){const ds=[...new Set(h.days)].sort();let best=0,cur=0,prev='';for(const d of ds){cur=(prev&&addDays(prev,1)===d)?cur+1:1;if(cur>best)best=cur;prev=d}return best}
function overallDay(d){let poss=0,done=0;habits.forEach(h=>{const st=habitStart(h);if(st&&d>=st){poss++;if(h.days.includes(d))done++}});return{poss,done}}
function overallRate(n,skip){let poss=0,done=0;for(let i=skip;i<skip+n;i++){const o=overallDay(addDays(today(),-i));poss+=o.poss;done+=o.done}return poss?Math.round(done/poss*100):null}

/* Diagramm: Quote der letzten 7 Tage */
function weekCard(){
  const t=today(),cur=overallRate(7,0),prev=overallRate(7,7);
  const days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const delta=cur!==null&&prev!==null?cur-prev:null;
  const bars=days.map(d=>{
    const o=overallDay(d),pct=o.poss?Math.round(o.done/o.poss*100):0;
    const tip=fmtFull(d)+' · '+(o.poss?o.done+' von '+o.poss+' geschafft ('+pct+' %)':'keine Daten');

/* Auswertung einer Gewohnheit */
let hsId=null;
function renderHstats(){
  const h=habits.find(x=>x.id===hsId);
  if(!h){view='habits';return renderHabits()}
  const t=today(),n=streak(h),best=longestStreak(h),set=new Set(h.days),st=habitStart(h),total=set.size;
  setTop(h.name,'Auswertung',{back:'Gewohnheiten'});
  const unit=k=>k===1?' Tag':' Tage';
  const tile=(l,v,u)=>`<div class="tile"><small>${l}</small><b>${v}${u?`<span>${u}</span>`:''}</b></div>`;
  const r7=habitRate(h,7),r30=habitRate(h,30),r90=habitRate(h,90);
  let html=`<div class="tiles">${tile('Serie',n,unit(n))}${tile('Rekord',best,unit(best))}${tile('Gesamt',total,unit(total))}</div>`+
    `<div class="tiles">${tile('7 Tage',r7?r7.pct:'–',r7?' %':'')}${tile('30 Tage',r30?r30.pct:'–',r30?' %':'')}${tile('90 Tage',r90?r90.pct:'–',r90?' %':'')}</div>`;
  // Kalender der letzten 12 Wochen
  const m0=addDays(t,-dowIdx(t)),start=addDays(m0,-77);
  let g='',lastM=-1;
  for(let w=0;w<12;w++){
    const d0=addDays(start,w*7),mo=new Date(d0+'T00:00').getMonth();
    if(mo!==lastM){g+=`<span class="hmm" style="grid-row:1;grid-column:${w+2} / span 3">${new Date(d0+'T00:00').toLocaleDateString('de-DE',{month:'short'})}</span>`;lastM=mo}
  }
  ['Mo','','Mi','','Fr','',''].forEach((l,r)=>{g+=`<span class="hmw" style="grid-row:${r+2};grid-column:1">${l}</span>`});
  for(let w=0;w<12;w++)for(let r=0;r<7;r++){
    const d=addDays(start,w*7+r),pos=`grid-row:${r+2};grid-column:${w+2}`;
    if(d>t){g+=`<span class="hm fut" style="${pos}" aria-hidden="true"></span>`;continue}
    const on=set.has(d),pre=st&&d<st&&!on;
    const tip=fmtFull(d)+' · '+(on?'geschafft':pre?'vor dem Start':'nicht geschafft');
    g+=`<button class="hm ${on?'on':pre?'pre':''} ${d===t?'td':''}" style="${pos}" data-tip="${tip}" data-tt="tip2" title="${tip}" aria-label="${tip}"></button>`;
  }
  html+=`<div class="sec"><h2>Letzte 12 Wochen</h2></div><div class="card"><div class="hmap" role="group" aria-label="Kalender der letzten 12 Wochen">${g}</div>
    <div class="leg"><span><i class="sw on"></i>Geschafft</span><span><i class="sw"></i>Nicht geschafft</span></div>
    <div class="tip" id="tip2" aria-live="polite">Tippe auf ein Feld für Details.</div></div>`;
  // Wochentage
  const stat=Array.from({length:7},()=>({tot:0,done:0}));
  for(let i=0;i<84;i++){const d=addDays(start,i);if(d>t)break;if(!st||d<st)continue;const k=dowIdx(d);stat[k].tot++;if(set.has(d))stat[k].done++}
  const pc=stat.map(x=>x.tot?Math.round(x.done/x.tot*100):null);
  const mx=Math.max(...pc.map(x=>x===null?-1:x)),enough=total>=7&&mx>0;
  const bi=pc.map((x,i)=>x===mx?i:-1).filter(i=>i>=0);
  const bars=pc.map((v,i)=>{
    const tip=WDL[i]+' · '+(stat[i].tot?stat[i].done+' von '+stat[i].tot+' Tagen ('+v+' %)':'keine Daten');
    const hi=enough&&bi.includes(i);
    return `<button class="bcol ${enough&&!hi?'dim':''}" data-tip="${tip}" data-tt="tip3" title="${tip}" aria-label="${tip}"><span class="bval">${hi&&bi.length<=2?v+' %':''}</span><span class="btrack"><i style="height:${v||0}%"></i></span><span class="blab">${WDS2[i]}</span></button>`;
  }).join('');
  const names=bi.map(i=>WDL[i]);
  const sentence=!enough?'Noch zu wenig Daten für ein Muster.':bi.length===1?`Am besten klappt es am ${names[0]} (${mx} %).`:bi.length<=3?`Am besten klappt es am ${names.slice(0,-1).join(', ')} und ${names[names.length-1]} (${mx} %).`:`An mehreren Wochentagen gleich gut (${mx} %).`;
  html+=`<div class="sec"><h2>Nach Wochentag</h2></div><div class="card"><p class="cap" style="color:var(--text);margin:0 0 4px">${sentence}</p>
    <div class="bars" role="group" aria-label="Quote nach Wochentag, letzte 12 Wochen">${bars}</div><div class="tip" id="tip3" aria-live="polite">Tippe auf einen Balken für Details.</div></div>`;
  // Tabelle
  html+=`<details class="tbl"><summary>Zahlen als Tabelle</summary><table><thead><tr><th>Zeitraum</th><th>Geschafft</th><th>Quote</th></tr></thead><tbody>`+
    [['7 Tage',r7],['30 Tage',r30],['90 Tage',r90]].map(([l,r])=>`<tr><td>${l}</td><td>${r?r.done+' von '+r.tot:'–'}</td><td>${r?r.pct+' %':'–'}</td></tr>`).join('')+
    `</tbody></table><table style="margin-top:12px"><thead><tr><th>Wochentag (12 Wochen)</th><th>Geschafft</th><th>Quote</th></tr></thead><tbody>`+
    stat.map((x,i)=>`<tr><td>${WDL[i]}</td><td>${x.tot?x.done+' von '+x.tot:'–'}</td><td>${x.tot?pc[i]+' %':'–'}</td></tr>`).join('')+`</tbody></table></details>`;
  html+=`<button class="btn" data-hedit="${h.id}" style="margin-top:18px">Gewohnheit bearbeiten</button>`;
  $('view').innerHTML=html;
}

/* ---------- Tagesrueckblick ---------- */
const MOODL=['','Schwierig','Anstrengend','Okay','Gut','Großartig'];
let draft={mood:0,good:'',focus:''};
function initReview(){const r=reviews.find(x=>x.date===today());draft=r?{mood:r.mood||0,good:r.good||'',focus:r.focus||''}:{mood:0,good:'',focus:''}}

  const t=today();

function ingFind(name){
  const k=String(name).toLowerCase().trim().replace(/\s+/g,' ');if(!k)return null;
  if(ING_MAP.has(k))return ING_MAP.get(k);
  for(const cut of [1,2,3]){if(k.length>cut+3){const w=k.slice(0,-cut);if(ING_MAP.has(w))return ING_MAP.get(w)}}
  return null;
}
function ingKey(name){
  const e=ingFind(name);if(e)return e.n.toLowerCase();
  const k=String(name).toLowerCase().trim().replace(/\s+/g,' ');
  return k.length>5?k.replace(/(en|n|e|s)$/,''):k;
}
function ingSuggest(q,limit=6){
  const t=String(q).toLowerCase().trim();if(!t)return[];
  const out=[];
  for(const e of ING_LIST){if(e.names.some(n=>n.startsWith(t)))out.push(e)}
  for(const e of ING_LIST){if(out.length>=limit)break;if(!out.includes(e)&&e.names.some(n=>n.includes(t)))out.push(e)}
  return out.slice(0,limit);
}

function fmtAmt(q,u){
  if(q==null)return '';

  if(u==='ml'&&q>=1000)return fmtNum(q/1000)+' l';
  return fmtNum(q)+(u?' '+u:'');
}
function parseShopText(t){
  const txt=String(t).trim();
  const m=txt.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(!m||!m[2])return{q:null,u:'',name:txt};
  const q=parseFloat(m[1].replace(',','.')),rest=m[2];
  const w=rest.split(/\s+/),first=w[0].toLowerCase().replace(/[.,]$/,'');
  if(UNIT_ALIAS[first]&&w.length>1)return{q,u:UNIT_ALIAS[first],name:w.slice(1).join(' ')};
  return{q,u:'',name:rest};
}
function mkShop(name,q,u,p,rec){
  const e=ingFind(name),unit=u||(q!=null&&e?e.u:''),b=toBase(q==null?null:Math.round(q*100)/100,unit);

function addToShop(name,q,u,p,rec){
  const it=mkShop(name,q,u,p,rec);
  const ex=shop.find(x=>!x.done&&(x.key||ingKey(x.name))===it.key&&(x.q==null||it.q==null||(x.u||'')===(it.u||'')));
  if(!ex){shop.push(it);return 'new'}
  if(ex.q!=null&&it.q!=null)ex.q=Math.round((ex.q+it.q)*100)/100;
  else if(it.q!=null){ex.q=it.q;ex.u=it.u}
  ex.p=ex.p===true&&it.p===true;
  ex.key=it.key;ex.r=ex.r||[];
  (it.r||[]).forEach(n=>{if(!ex.r.includes(n))ex.r.push(n)});
  return 'merged';
}

    else h+=recipes.map(r=>{const m=r.ings.filter(i=>!i.p).length;return `<button class="card pcard" data-ropen="${r.id}"><div class="phd"><b>${esc(r.name)}</b><span class="meta">${r.portions} Port.</span></div><div class="meta" style="margin-top:2px">${r.ings.length} Zutaten · ${m} zu kaufen · ${r.ings.length-m} wahrscheinlich vorrätig</div></button>`}).join('');
    $('view').innerHTML=h;return;
  }
  h+=`<form class="sform" id="sform" autocomplete="off"><input id="sname" type="text" placeholder="Artikel, z. B. 2 Tomaten" aria-label="Artikel"><button aria-label="Hinzufügen">${ic('plus',22,2.2)}</button></form><div class="sug" id="ssug"></div>`;
  if(!shop.length)h+=`<div class="empty"><b>Die Liste ist leer</b>Schreibe oben einen Artikel auf, zum Beispiel „2 Tomaten“, oder setze die Zutaten eines Rezepts auf die Liste.</div>`;
  if(must.length){
    h+=`<div class="sec"><h2>Unbedingt kaufen</h2><span class="meta">${must.length}</span></div>`;
    CATO.forEach(c=>{const g=must.filter(x=>catOf(x)===c).sort((a,b)=>a.name.localeCompare(b.name,'de'));if(g.length)h+=`<div class="shcat">${CATL[c]}</div>`+g.map(x=>shopRow(x,false)).join('')});
  }
  if(pan.length){
    h+=`<div class="sec"><h2>Wahrscheinlich vorrätig</h2><button class="link" data-shaveall="1">Alles da</button></div><p class="hint">Schau kurz nach, ob du es zu Hause hast. „Fehlt“ schiebt es nach oben.</p>`+pan.sort((a,b)=>a.name.localeCompare(b.name,'de')).map(x=>shopRow(x,true)).join('');
  }
  if(done.length)h+=`<div class="sec"><h2>Abgehakt</h2><span class="meta">${done.length}</span></div>`+done.map(x=>shopRow(x,false)).join('')+`<button class="clear" data-sclear="1">Abgehakte entfernen (${done.length})</button>`;
  $('view').innerHTML=h;
}
function renderRecipe(){
  const r=recOf(recId);
  if(!r){view='shop';shopSeg='recipes';return renderShop()}
  if(!recPort)recPort=r.portions||2;
  const f=recPort/(r.portions||1);
  setTop(r.name,r.portions+' Portionen im Rezept',{back:'Rezepte'});
  const must=r.ings.filter(i=>!i.p),pan=r.ings.filter(i=>i.p);
  const row=i=>`<div class="rrow"><span class="rn">${esc(i.name)}</span><span class="ra">${i.q!=null?esc(fmtAmt(Math.round(i.q*f*100)/100,i.u)):'nach Bedarf'}</span></div>`;
  let h=`<div class="card"><div class="meta" style="justify-content:center">Für wie viele Portionen?</div><div class="stepper"><button data-rport="-1" aria-label="Weniger">${ic('chevL',20,2)}</button><b>${recPort} ${recPort===1?'Portion':'Portionen'}</b><button data-rport="1" aria-label="Mehr">${ic('chevR',20,2)}</button></div></div>`;
  h+=`<button class="btn main" data-rtoshop="1" style="margin-top:12px">${ic('cart',18,2)} Zutaten auf die Einkaufsliste</button>`;
  h+=`<div class="sec"><h2>Unbedingt kaufen</h2><span class="meta">${must.length}</span></div>`+(must.length?must.map(row).join(''):`<div class="empty" style="padding:12px">Keine Zutat markiert.</div>`);
  if(pan.length)h+=`<div class="sec"><h2>Wahrscheinlich vorrätig</h2><span class="meta">${pan.length}</span></div>`+pan.map(row).join('');
  if(r.note)h+=`<div class="sec"><h2>Zubereitung</h2></div><div class="card"><p class="pnote" style="margin:0">${esc(r.note)}</p></div>`;
  h+=`<button class="btn" data-redit="${r.id}" style="margin-top:18px">Rezept bearbeiten</button>`;
  $('view').innerHTML=h;
}
function updateShopSug(){

/* Rezept bearbeiten (Sheet) */
let sheetIngs=[];
function renderIngs(){
  $('r-ings').innerHTML=sheetIngs.length?sheetIngs.map((i,k)=>`<div class="ing"><input type="number" step="any" inputmode="decimal" data-iq="${k}" value="${i.q==null?'':i.q}" placeholder="–" aria-label="Menge ${esc(i.name)}"><select data-iu="${k}" aria-label="Einheit ${esc(i.name)}"><option value="">–</option>${UNITS.map(u=>`<option ${u===i.u?'selected':''}>${u}</option>`).join('')}</select><span class="iname">${esc(i.name)}</span><button type="button" class="pv ${i.p?'on':''}" data-ip="${k}" aria-pressed="${i.p}" title="Umschalten">${i.p?'Vorrat':'Kaufen'}</button><button type="button" class="ix" data-ix="${k}" aria-label="Entfernen">${ic('x',16,2)}</button></div>`).join(''):`<div class="hint">Noch keine Zutaten.</div>`;

function updateIngSug(){
  const el=$('r-sug');if(!el)return;
  const q=parseShopText($('r-iname').value).name;
  el.innerHTML=(q.length>=1?ingSuggest(q):[]).map(e=>`<button type="button" data-rsug="${esc(e.n)}">${esc(e.n)}<small>${e.u}</small></button>`).join('');
}
function addIngFromInputs(){
  const raw=$('r-iname').value.trim();if(!raw)return false;
  const ps=parseShopText(raw);let q=null,u=$('r-iu').value;
  const qv=$('r-iq').value.trim().replace(',','.');
  if(qv!==''&&!isNaN(parseFloat(qv)))q=parseFloat(qv);
  else if(ps.q!=null){q=ps.q;if(ps.u)u=ps.u}
  const e=ingFind(ps.name);
  if(!u&&q!=null&&e)u=e.u;
  sheetIngs.push({id:uid(),name:e?e.n:cap(ps.name),q,u:u||'',p:e?e.v===1:false});
  $('r-iname').value='';$('r-iq').value='';$('r-iu').value='';
  renderIngs();updateIngSug();return true;
}

/* ---------- Notizen ---------- */
function noteTitle(n){const l=n.text.split('\n').find(x=>x.trim());return l?l.trim():'Neue Notiz'}
function notePreview(n){return n.text.split('\n').filter(x=>x.trim()).slice(1).join(' ').trim()}
function renderNoteList(){
  const q=noteQ.trim().toLowerCase();
  const l=notes.filter(n=>!q||n.text.toLowerCase().includes(q)).sort((a,b)=>b.upd-a.upd);
  $('nlist').innerHTML=l.length?l.map(n=>`<button class="nrow" data-nopen="${n.id}"><b>${esc(noteTitle(n))}</b><span>${esc(notePreview(n))||'Kein weiterer Text'}</span><small>${new Date(n.upd).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</small></button>`).join(''):`<div class="empty"><b>${notes.length?'Keine Treffer':'Noch keine Notizen'}</b>${notes.length?'Versuche ein anderes Wort.':'Tippe auf das Plus, um die erste anzulegen.'}</div>`;
}
function renderNotes(){
  if(openNote!==null){
    const n=notes.find(x=>x.id===openNote);if(!n){openNote=null;return renderNotes()}
    setTop('Notiz','',{back:true,act:`<button class="tact danger" data-ndel="1">${ic('trash',16,2)} Löschen</button>`});
    $('view').innerHTML=`<textarea id="ntext" placeholder="Notiz schreiben… Die erste Zeile ist der Titel."></textarea>`;

  }

}
function newNote(){const n={id:Date.now(),text:'',upd:Date.now()};notes.push(n);saveN();openNote=n.id;render()}
function leaveNote(){const n=notes.find(x=>x.id===openNote);if(n&&!n.text.trim()){notes=notes.filter(x=>x!==n);saveN()}openNote=null}

/* ---------- Sheet ---------- */
let sheet={mode:null,id:null},sheetPrio=3,sheetSubs=[];
function renderSubs(){
  $('t-subs').innerHTML=sheetSubs.map((s,i)=>`<div class="subrow ${s.done?'done':''}"><button type="button" class="chk sm" data-subt="${i}" aria-label="${s.done?'Wieder öffnen':'Erledigt'}">${s.done?ic('check',13,2.8):''}</button><span>${esc(s.t)}</span><button type="button" class="subx" data-subx="${i}" aria-label="Entfernen">${ic('x',16,2)}</button></div>`).join('');
}
function setChips(){
  const d=$('t-date').value,t=today();
  const on={today:d===t,tomorrow:d===addDays(t,1),week:d&&d===addDays(t,7-((new Date().getDay()+6)%7)),none:!d};
  document.querySelectorAll('#t-chips .chip').forEach(b=>b.classList.toggle('on',!!on[b.dataset.dc]));
}
function setPrio(p){sheetPrio=p;document.querySelectorAll('#t-prio button').forEach(b=>b.classList.toggle('on',+b.dataset.sp===p))}
function openSheet(mode,id,pre){
  sheet={mode,id:id||null};
  $('tform').hidden=mode!=='task';$('hform').hidden=mode!=='habit';$('pform').hidden=mode!=='project';$('rform').hidden=mode!=='recipe';
  if(mode==='task'){
    const x=id?tasks.find(t=>t.id==id):null;
    $('sh-title').textContent=x?'Aufgabe bearbeiten':'Neue Aufgabe';
    $('t-title').value=x?x.title:'';
    $('t-date').value=x?x.date||'':(view==='home'?today():'');
    $('t-time').value=x?x.time||'':'';
    $('t-rem').value=x&&hasRem(x)?String(x.rem):'';
    $('t-time').required=$('t-rem').value!=='';
    $('t-cat').value=x?x.cat:'Privat';
    $('t-rep').value=x?x.rep||'':'';
    setPrio(x?x.prio:3);setChips();
    $('t-proj').innerHTML=['<option value="">Kein Projekt</option>'].concat(projects.filter(q=>!q.closed||(x&&x.proj===q.id)).map(q=>`<option value="${q.id}">${esc(q.name)}</option>`)).join('');
    $('t-proj').value=String(x?(x.proj||''):(pre||''));
    sheetSubs=x&&x.sub?x.sub.map(z=>({...z})):[];$('t-subadd').value='';renderSubs();
    $('t-del').hidden=!x;
  }else if(mode==='habit'){
    const x=id?habits.find(h=>h.id==id):null;
    $('sh-title').textContent=x?'Gewohnheit bearbeiten':'Neue Gewohnheit';
    $('h-name').value=x?x.name:'';$('h-del').hidden=!x;
  }else if(mode==='recipe'){
    const x=id?recipes.find(q=>q.id==id):null;
    $('sh-title').textContent=x?'Rezept bearbeiten':'Neues Rezept';
    $('r-name').value=x?x.name:'';$('r-port').value=x?x.portions:2;$('r-note').value=x?x.note||'':'';
    $('r-iu').innerHTML='<option value="">Einheit</option>'+UNITS.map(u=>`<option>${u}</option>`).join('');
    $('r-iname').value='';$('r-iq').value='';
    sheetIngs=x?x.ings.map(i=>({...i})):[];renderIngs();updateIngSug();
    $('r-del').hidden=!x;
  }else if(mode==='project'){
    const x=id?projects.find(q=>q.id==id):null;
    $('sh-title').textContent=x?'Projekt bearbeiten':'Neues Projekt';
    $('p-name').value=x?x.name:'';$('p-note').value=x?x.note||'':'';$('p-due').value=x?x.due||'':'';$('p-del').hidden=!x;
  }
  $('sheet').hidden=false;document.body.classList.add('lock');
  if(!id)setTimeout(()=>{try{if(!$('sheet').hidden&&!$('sheet').contains(document.activeElement))$(mode==='task'?'t-title':mode==='habit'?'h-name':mode==='recipe'?'r-name':'p-name').focus()}catch(e){}},60);
}
function closeSheet(){$('sheet').hidden=true;document.body.classList.remove('lock');sheet={mode:null,id:null}}
$('sh-x').innerHTML=ic('x',18,2);
$('t-chips').addEventListener('click',e=>{
  const b=e.target.closest('[data-dc]');if(!b)return;
  const t=today(),k=b.dataset.dc;
  $('t-date').value=k==='today'?t:k==='tomorrow'?addDays(t,1):k==='week'?addDays(t,7-((new Date().getDay()+6)%7)):'';
  setChips();
});
$('t-date').addEventListener('change',setChips);
$('t-rem').addEventListener('change',e=>{$('t-time').required=e.target.value!==''});
$('t-prio').addEventListener('click',e=>{const b=e.target.closest('[data-sp]');if(b)setPrio(+b.dataset.sp)});
$('tform').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('t-title').value.trim();if(!title)return;
  let date=$('t-date').value;const time=$('t-time').value,rem=$('t-rem').value;
  if(rem!==''&&!date)date=today();
  const pend=$('t-subadd').value.trim();if(pend)sheetSubs.push({id:Date.now(),t:pend,done:false});
  const f={title,date,time,rem,prio:sheetPrio,cat:$('t-cat').value,rep:$('t-rep').value,proj:$('t-proj').value?+$('t-proj').value:'',sub:sheetSubs.map(z=>({...z}))};
  if(sheet.id){
    const x=tasks.find(t=>t.id==sheet.id);
    if(x){const ch=x.date!==date||x.time!==time||String(x.rem??'')!==rem;Object.assign(x,f);if(ch){x.reminded=false;delete x.snoozeUntil}}
  }else tasks.push(Object.assign({id:Date.now(),reminded:false,done:false},f));
  saveT();closeSheet();checkReminders();render();
});
$('rform').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('r-name').value.trim();if(!name)return;
  addIngFromInputs();
  const r={name,portions:Math.max(1,Math.min(50,parseInt($('r-port').value,10)||2)),note:$('r-note').value.trim(),ings:sheetIngs.map(i=>({...i}))};
  if(sheet.id){const x=recipes.find(q=>q.id==sheet.id);if(x)Object.assign(x,r);recPort=0}
  else{const n=Object.assign({id:uid()},r);recipes.push(n);recId=n.id;recPort=0;view='recipe';window.scrollTo(0,0)}
  saveX();closeSheet();render();

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='r-iname'){e.preventDefault();addIngFromInputs()}
});
$('pform').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('p-name').value.trim();if(!name)return;
  const f={name,note:$('p-note').value.trim(),due:$('p-due').value};
  if(sheet.id){const x=projects.find(q=>q.id==sheet.id);if(x)Object.assign(x,f)}
  else{const n=Object.assign({id:Date.now(),closed:false},f);projects.push(n);projId=n.id;view='proj';window.scrollTo(0,0)}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='t-subadd'){
    e.preventDefault();const v=e.target.value.trim();if(!v)return;
    sheetSubs.push({id:Date.now(),t:v,done:false});e.target.value='';renderSubs();
  }
});
$('hform').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('h-name').value.trim();if(!name)return;
  if(sheet.id){const x=habits.find(h=>h.id==sheet.id);if(x)x.name=name}else habits.push({id:Date.now(),name,days:[]});
  saveH();closeSheet();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});

/* ---------- Klicks ---------- */
function go(v){if(view==='notes')leaveNote();if(v==='review')initReview();view=v;openNote=null;window.scrollTo(0,0);render()}
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('bd')){closeSheet();return}
  const b=e.target.closest('button');if(!b)return;
  const D=b.dataset;
  if(b.id==='fab'){const f=fabInfo();if(!f)return;if(f[0]==='note')newNote();else openSheet(f[0],null,view==='proj'?projId:undefined);return}
  if(D.tip&&D.tt){const el=$(D.tt);if(el)el.textContent=D.tip;return}
  if(D.subt!==undefined){const z=sheetSubs[+D.subt];if(z){z.done=!z.done;renderSubs()}return}
  if(D.subx!==undefined){sheetSubs.splice(+D.subx,1);renderSubs();return}
  if(D.ip!==undefined){const i=sheetIngs[+D.ip];if(i){i.p=!i.p;renderIngs()}return}
  if(D.ix!==undefined){sheetIngs.splice(+D.ix,1);renderIngs();return}
  if(D.rsug){$('r-iname').value=D.rsug;const e=ingFind(D.rsug);if(e)$('r-iu').value=e.u;$('r-sug').innerHTML='';$('r-iq').focus();return}
  if(D.radd){addIngFromInputs();return}
  if(D.rdel){const id=+sheet.id;closeSheet();destructive('Rezept gelöscht',()=>{recipes=recipes.filter(q=>q.id!==id);saveX();if(view==='recipe'){view='shop';shopSeg='recipes'}});return}
  if(D.close){closeSheet();return}
  if(D.pdel){const id=+sheet.id;closeSheet();destructive('Projekt gelöscht, Aufgaben bleiben',()=>{projects=projects.filter(q=>q.id!=id);tasks.forEach(t=>{if(t.proj===id)t.proj=''});saveP();saveT();if(view==='proj'){view='tasks';taskSeg='projects'}});return}
  if(D.tdel){const id=sheet.id;closeSheet();destructive('Aufgabe gelöscht',()=>{tasks=tasks.filter(t=>t.id!=id);saveT()});return}
  if(D.hdel){const id=sheet.id;closeSheet();destructive('Gewohnheit gelöscht',()=>{habits=habits.filter(t=>t.id!=id);saveH()});return}
  if(D.nav){go(D.nav);return}
  if(D.go){go(D.go);return}
  if(D.back){if(view==='notes'&&openNote!==null){leaveNote();render()}else{if(view==='proj')taskSeg='projects';if(view==='recipe')shopSeg='recipes';go(view==='review'?'home':view==='hstats'?'habits':view==='proj'?'tasks':view==='recipe'?'shop':'more')}return}
  if(D.done){toggleTask(D.done)}
  else if(D.edit){openSheet('task',D.edit);return}
  else if(D.shseg){shopSeg=D.shseg}
  else if(D.ropen){recId=+D.ropen;recPort=0;view='recipe';window.scrollTo(0,0)}
  else if(D.rport){recPort=Math.max(1,Math.min(50,recPort+(+D.rport)))}
  else if(D.rtoshop){const r=recOf(recId);if(r)recipeToShop(r,recPort||r.portions);return}
  else if(D.redit){openSheet('recipe',D.redit);return}
  else if(D.rsample){snap.last=snap();recipes=recipes.concat(makeSamples());saveX();render();toast('Beispielrezepte geladen');return}
  else if(D.shave){destructive('Als vorhanden abgehakt',()=>{shop=shop.filter(t=>t.id!=D.shave);saveS()});return}
  else if(D.smiss){const x=shop.find(t=>t.id==D.smiss);if(x){x.p=false;saveS()}}
  else if(D.shaveall){destructive('Alle als vorhanden abgehakt',()=>{shop=shop.filter(t=>t.p!==true||t.done);saveS()});return}
  else if(D.ssug){const inp=$('sname'),txt=inp.value.trim(),pr=parseShopText(txt);inp.value=txt.slice(0,txt.length-pr.name.length)+D.ssug;updateShopSug();inp.focus();return}
  else if(D.popen){projId=+D.popen;view='proj';window.scrollTo(0,0)}
  else if(D.goproj){taskSeg='projects';go('tasks');return}
  else if(D.pedit){openSheet('project',D.pedit);return}
  else if(D.pclose){const q=projOf(projId);if(q){q.closed=!q.closed;saveP()}}
  else if(D.hstats){hsId=+D.hstats;view='hstats';window.scrollTo(0,0)}
  else if(D.mood){draft.mood=+D.mood;$('moodrow').innerHTML=moodRow();return}
  else if(D.rvdone){toggleTask(D.rvdone)}
  else if(D.rvmove){const x=tasks.find(t=>t.id==D.rvmove);if(x){x.date=addDays(today(),1);x.reminded=false;delete x.snoozeUntil;saveT()}}
  else if(D.rvdrop){destructive('Aufgabe gestrichen',()=>{tasks=tasks.filter(t=>t.id!=D.rvdrop);saveT()});return}
  else if(D.rvall){destructive('Alles auf morgen verschoben',()=>{const tm=addDays(today(),1);dayStats().due.forEach(x=>{x.date=tm;x.reminded=false;delete x.snoozeUntil});saveT()});return}
  else if(D.rvsave){saveReview();return}
  else if(D.rvdel){destructive('Rückblick gelöscht',()=>{reviews=reviews.filter(r=>r.date!==D.rvdel);saveR()});return}
  else if(D.seg){taskSeg=D.seg}
  else if(b.matches('[data-cat]')){catFilter=D.cat}
  else if(D.cleardone){destructive('Erledigte entfernt',()=>{tasks=tasks.filter(t=>!t.done);saveT()});return}
  else if(D.hday){const[id,d]=D.hday.split('|');const h=habits.find(x=>x.id==id);h.days=h.days.includes(d)?h.days.filter(x=>x!==d):[...h.days,d];saveH()}
  else if(D.hchip){const h=habits.find(x=>x.id==D.hchip),t=today();h.days=h.days.includes(t)?h.days.filter(x=>x!==t):[...h.days,t];saveH()}
  else if(D.hedit){openSheet('habit',D.hedit);return}
  else if(D.wk){weekOffset=D.wk==='reset'?0:weekOffset+(+D.wk)}
  else if(D.wadd){addDay=addDay===D.wadd?null:D.wadd}
  else if(D.sdone){const x=shop.find(t=>t.id==D.sdone);x.done=!x.done;saveS()}
  else if(D.sdel){destructive('Artikel entfernt',()=>{shop=shop.filter(t=>t.id!=D.sdel);saveS()});return}
  else if(D.sclear){destructive('Abgehakte entfernt',()=>{shop=shop.filter(t=>!t.done);saveS()});return}
  else if(D.nopen){openNote=+D.nopen}
  else if(D.ndel){const id=openNote;openNote=null;destructive('Notiz gelöscht',()=>{notes=notes.filter(x=>x.id!==id);saveN()});return}
  else if(D.aok){alerts=alerts.filter(i=>i!=D.aok)}
  else if(D.asnz){const x=tasks.find(t=>t.id==D.asnz);if(x){x.reminded=false;x.snoozeUntil=Date.now()+600000;saveT()}alerts=alerts.filter(i=>i!=D.asnz)}
  else if(D.perm){try{Promise.resolve(Notification.requestPermission()).then(()=>render()).catch(()=>{permBlocked=true;render()})}catch(err){permBlocked=true}return}
  else if(D.bdl){downloadBackup();return}
  else if(D.bcopy){copyBackup();return}
  else if(D.bfile){$('bfile').click();return}
  else if(D.bapply){applyImport();return}
  else if(D.bcancel){pendingImport=null}
  else return;
  render();
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='qform'){e.preventDefault();addQuick();const i=$('qtext');if(i)i.focus();return}
  if(f.id==='sform'){
    e.preventDefault();const v=$('sname').value.trim();if(!v)return;
    const ps=parseShopText(v);addToShop(ps.name,ps.q,ps.u,false,'');saveS();render();$('sname').focus();
  }else if(f.classList&&f.classList.contains('wform')){
    e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;
    tasks.push({id:Date.now(),title:v,date:f.dataset.d,time:'',rem:'',reminded:false,prio:3,cat:'Privat',rep:'',done:false});
    saveT();render();
  }
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.iu!==undefined){const i=sheetIngs[+t.dataset.iu];if(i)i.u=t.value}});
document.addEventListener('input',e=>{
  if(e.target.id==='ntext'){const n=notes.find(x=>x.id===openNote);if(n){n.text=e.target.value;n.upd=Date.now();saveN()}}
  else if(e.target.id==='rv-good'){draft.good=e.target.value}
  else if(e.target.id==='rv-focus'){draft.focus=e.target.value}
  else if(e.target.id==='sname'){updateShopSug()}
  else if(e.target.id==='r-iname'){updateIngSug()}
  else if(e.target.dataset&&e.target.dataset.iq!==undefined){const i=sheetIngs[+e.target.dataset.iq];if(i){const v=e.target.value.replace(',','.');i.q=v===''||isNaN(parseFloat(v))?null:parseFloat(v)}}
  else if(e.target.id==='qtext'){quickText=e.target.value;updateQuick()}
  else if(e.target.id==='nsearch'){noteQ=e.target.value;renderNoteList()}
});

/* ---------- Start ---------- */
setInterval(checkReminders,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
//@SEED
checkReminders();
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});//@SW
</script>
