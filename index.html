<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Mein Alltag</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{--bg:#f8f5f0;--card:#fffdfa;--text:#2e2924;--muted:#8a8076;--accent:#8c6d3f;--on-accent:#fff;--soft:#f3e9d6;--line:#ece5da;--red:#c9645a;--amber:#d09a3c;--green:#5b8c71;--shadow:0 1px 2px rgba(80,60,30,.05),0 8px 22px rgba(80,60,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#252019;--text:#f1eadf;--muted:#a59b8e;--line:#39322a;--accent:#cfae72;--on-accent:#1f1a14;--soft:#3a3227;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding-bottom:calc(210px + env(safe-area-inset-bottom))}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 8px}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:34px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.sub{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
nav button{border:0;background:var(--card);color:var(--text);padding:8px 14px;border-radius:20px;font-size:15px;white-space:nowrap}
nav button.on{background:var(--accent);color:var(--on-accent)}
main{padding:0 16px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);padding:12px;border-radius:14px;margin:8px 0}
.item .t{flex:1;min-width:0}
.item .t div:first-child{word-break:break-word}
.meta{font-size:12px;color:var(--muted)}
.meta .over{color:var(--red);font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;color:#fff;font-size:15px;padding:0}
.done .chk{background:var(--green);border-color:var(--green)}
.done .t div:first-child{text-decoration:line-through;color:var(--muted)}
.p1{border-left:4px solid var(--red)}.p2{border-left:4px solid var(--amber)}.p3{border-left:4px solid var(--line)}
.del{border:0;background:none;color:var(--muted);font-size:20px;padding:4px 8px}
.hab{background:var(--card);border-radius:14px;padding:12px;margin:8px 0}
.hab .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.streak{font-size:13px;color:var(--amber);font-weight:600;white-space:nowrap}
.days{display:flex;justify-content:space-between;margin-top:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:16px;padding:0}
.day button.on{background:var(--green);border-color:var(--green)}
.day.today span{color:var(--accent);font-weight:700}
.clear{display:block;margin:12px auto;border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;padding:8px}
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0}
.wk-nav button{border:0;background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font-size:16px}
.wk-nav b{flex:1;text-align:center;font-size:15px}
.wday h3{margin:18px 0 2px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-weight:600}
.wday.today h3{color:var(--accent)}
.wday.over h3{color:var(--red)}
.wadd{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;padding:6px 0}
.wform input{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:10px;margin:4px 0}
.wday .none{color:var(--muted);font-size:13px;padding:4px 0}
.nrow{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--text);font:inherit;border-radius:14px;padding:12px;margin:8px 0}
.nrow b{display:block;word-break:break-word}
.nrow span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow small{font-size:11px;color:var(--muted)}
#nsearch{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 6px}
.ned{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.ned button{border:0;background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:15px}
.ned .nd{color:var(--red)}
#ntext{display:block;width:100%;min-height:55vh;resize:none;font:inherit;line-height:1.5;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#nf button{grid-column:1/-1;padding:12px;font-size:16px}
.al{display:flex;gap:8px;align-items:center;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0}
.al .at{flex:1;min-width:0;word-break:break-word}
.al button{border:0;border-radius:8px;padding:6px 10px;background:var(--card);color:var(--accent);box-shadow:var(--shadow);font:inherit;font-size:14px}
#banner{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
#perm{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;padding:6px 0}
form .row>*{font-size:14px}
.item,.hab,.nrow,nav button,.wk-nav button,.ned button{box-shadow:var(--shadow)}
.item,.hab,.nrow,.al{border-radius:18px}
nav button{padding:9px 16px;font-size:14px;letter-spacing:.02em}
form{box-shadow:0 -8px 24px rgba(80,60,30,.07)}
form input,form select{border-radius:12px}
.sub{letter-spacing:.03em}
.wday h3{letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
form{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:8px}
form[hidden]{display:none}
form input,form select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
form .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
form .row>*{flex:1 1 28%;min-width:0}
form button{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:0 18px;font-size:22px}
</style>
</head>
<body>
<header><h1>Mein Alltag</h1><div class="sub" id="sub"></div></header>
<div id="banner"></div>
<nav id="tabs"></nav>
<main id="list"></main>
<form id="f">
  <input id="title" placeholder="Neue Aufgabe…" required autocomplete="off">
  <button aria-label="Hinzufügen">＋</button>
  <div class="row">
    <input id="date" type="date">
    <select id="prio"><option value="3">Normal</option><option value="2">Wichtig</option><option value="1">Dringend</option></select>
    <select id="cat"><option>Privat</option><option>Arbeit</option><option>Haushalt</option><option>Gesundheit</option><option>Einkauf</option></select>
    <input id="time" type="time" aria-label="Uhrzeit">
    <select id="rem" aria-label="Erinnerung"><option value="">🔔 aus</option><option value="0">🔔 pünktlich</option><option value="10">🔔 10 Min vorher</option><option value="60">🔔 1 Std vorher</option></select>
    <select id="rep"><option value="">Einmalig</option><option value="daily">Täglich</option><option value="weekly">Wöchentlich</option><option value="monthly">Monatlich</option></select>
  </div>
</form>
<form id="hf" hidden>
  <input id="hname" placeholder="Neue Gewohnheit… (z. B. Wasser trinken)" autocomplete="off">
  <button aria-label="Hinzufügen">＋</button>
</form>
<form id="sf" hidden>
  <input id="sname" placeholder="Einkaufen… (z. B. Milch)" autocomplete="off">
  <button aria-label="Hinzufügen">＋</button>
</form>
<form id="nf" hidden>
  <button type="submit">＋ Neue Notiz</button>
</form>
<script>
const KEY='alltag.tasks.v1';
let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const HKEY='alltag.habits.v1';
let habits=[];try{habits=JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){}
const saveH=()=>{try{localStorage.setItem(HKEY,JSON.stringify(habits))}catch(e){}};
const SKEY='alltag.shop.v1';
let shop=[];try{shop=JSON.parse(localStorage.getItem(SKEY))||[]}catch(e){}
const saveS=()=>{try{localStorage.setItem(SKEY,JSON.stringify(shop))}catch(e){}};
const NKEY='alltag.notes.v1';
let notes=[];try{notes=JSON.parse(localStorage.getItem(NKEY))||[]}catch(e){}
const saveN=()=>{try{localStorage.setItem(NKEY,JSON.stringify(notes))}catch(e){}};
let openNote=null,noteQ='',confirmDel=false;
let tab='heute',weekOffset=0,addDay=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const TABS=[['heute','Heute'],['woche','Woche'],['geplant','Geplant'],['alle','Alle'],['erledigt','Erledigt'],['habits','Gewohnheiten'],['shop','Einkauf'],['notizen','Notizen']];
let alerts=[];
const hasRem=x=>x.rem!==undefined&&x.rem!==null&&x.rem!=='';
function notify(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const fb=()=>{try{new Notification(title,{body,tag})}catch(e){}};
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
      navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification?r.showNotification(title,{body,tag,icon:'icons/icon.svg'}):fb()).catch(fb);
    else fb();
  }catch(e){}
}
function renderBanner(){
  const el=document.getElementById('banner');
  const items=alerts.map(id=>tasks.find(t=>t.id===id)).filter(x=>x&&!x.done);
  alerts=items.map(x=>x.id);
  let h=items.map(x=>`<div class="al"><div class="at">🔔 <b>${x.time||''}</b> ${esc(x.title)}</div><button data-asnz="${x.id}">+10 Min</button><button data-aok="${x.id}">OK</button></div>`).join('');
  let canAsk=false;try{canAsk=!permBlocked&&'Notification' in window&&Notification.permission==='default'}catch(e){}
  if(canAsk)h+='<button id="perm" data-perm="1">🔔 Benachrichtigungen aktivieren</button>';
  el.innerHTML=h;
}
let permBlocked=false;
function checkReminders(){
  const now=Date.now();let ch=false;
  tasks.forEach(x=>{
    if(x.done||!hasRem(x)||x.reminded||!x.date||!x.time)return;
    const due=new Date(x.date+'T'+x.time).getTime()-(+x.rem)*60000;
    if(Math.max(due,x.snoozeUntil||0)<=now){
      x.reminded=true;ch=true;
      if(!alerts.includes(x.id))alerts.push(x.id);
      notify(x.rem==='0'?'Jetzt: '+x.title:'Gleich: '+x.title,(x.time||'')+(x.cat?' · '+x.cat:''),'t'+x.id);
    }
  });
  if(ch)save();
  renderBanner();
}
const REPN={daily:'Täglich',weekly:'Wöchentlich',monthly:'Monatlich'};
function nextDate(d,r){
  const x=new Date(d+'T00:00');
  if(r==='daily')x.setDate(x.getDate()+1);
  else if(r==='weekly')x.setDate(x.getDate()+7);
  else{const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  return iso(x);
}
function toggleTask(id){
  const x=tasks.find(t=>t.id==id);if(!x)return;
  x.done=!x.done;
  if(x.done&&x.rep){
    let d=nextDate(x.date||today(),x.rep);
    while(d<=today())d=nextDate(d,x.rep);
    const n={id:Date.now(),title:x.title,date:d,time:x.time||'',rem:x.rem,reminded:false,prio:x.prio,cat:x.cat,rep:x.rep,done:false};
    x.next=n.id;tasks.push(n);
  }else if(!x.done&&x.next){
    const n=tasks.find(t=>t.id===x.next);
    if(n&&!n.done)tasks=tasks.filter(t=>t!==n);
    delete x.next;
  }
  save();
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function visible(){
  const t=today();
  let l=tasks.filter(x=>{
    if(tab==='erledigt')return x.done;
    if(x.done)return false;
    if(tab==='heute')return !x.date||x.date<=t;
    if(tab==='geplant')return x.date&&x.date>t;
    return true;
  });
  return l.sort((a,b)=>(a.prio-b.prio)||((a.date||'9')>(b.date||'9')?1:-1));
}
function fmt(d){return new Date(d+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}
function addDays(d,n){const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)}
function streak(h){
  let d=today();if(!h.days.includes(d))d=addDays(d,-1);
  let n=0;while(h.days.includes(d)){n++;d=addDays(d,-1)}return n;
}
function renderHabits(){
  const t=today();
  const week=[...Array(7)].map((_,i)=>addDays(t,i-6));
  document.getElementById('list').innerHTML=habits.length?habits.map(h=>{
    const n=streak(h);
    return `<div class="hab">
      <div class="top"><b>${esc(h.name)}</b>
      <span class="streak">${n?`🔥 ${n} ${n===1?'Tag':'Tage'}`:''}</span>
      <button class="del" data-hdel="${h.id}" aria-label="Löschen">×</button></div>
      <div class="days">${week.map(d=>`<div class="day ${d===t?'today':''}"><button class="${h.days.includes(d)?'on':''}" data-hday="${h.id}|${d}">${h.days.includes(d)?'✓':''}</button><span>${new Date(d+'T00:00').toLocaleDateString('de-DE',{weekday:'short'})}</span></div>`).join('')}</div>
    </div>`}).join(''):'<div class="empty">Noch keine Gewohnheiten.<br>Lege unten die erste an.</div>';
}
function itemRow(x,showDate){
  return `<div class="item p${x.prio} ${x.done?'done':''}">
      <button class="chk" data-done="${x.id}">${x.done?'✓':''}</button>
      <div class="t"><div>${esc(x.title)}</div>
      <div class="meta">${esc(x.cat)}${x.rep?' · 🔁 '+REPN[x.rep]:''}${showDate&&x.date?` · <span class="${!x.done&&x.date<today()?'over':''}">${fmt(x.date)}</span>`:''}${x.time?' · '+x.time+(hasRem(x)?' 🔔':''):''}</div></div>
      <button class="del" data-del="${x.id}" aria-label="Löschen">×</button>
    </div>`;
}
function renderWeek(){
  const t=today();
  const mon=addDays(t,-((new Date().getDay()+6)%7)+7*weekOffset);
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));
  const short=d=>new Date(d+'T00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short'});
  const sortT=(a,b)=>(a.done-b.done)||(a.time||'99:99').localeCompare(b.time||'99:99')||(a.prio-b.prio);
  let h=`<div class="wk-nav"><button data-wk="-1" aria-label="Vorherige Woche">‹</button><b>${short(days[0])} – ${short(days[6])}</b><button data-wk="1" aria-label="Nächste Woche">›</button></div>`;
  if(weekOffset!==0)h+=`<button class="wadd" data-wk="reset">Zurück zu dieser Woche</button>`;
  if(weekOffset===0){
    const od=tasks.filter(x=>!x.done&&x.date&&x.date<mon).sort(sortT);
    if(od.length)h+=`<section class="wday over"><h3><span>Überfällig</span><span>${od.length}</span></h3>${od.map(x=>itemRow(x,true)).join('')}</section>`;
  }
  h+=days.map(d=>{
    const l=tasks.filter(x=>x.date===d).sort(sortT);
    const open=l.filter(x=>!x.done).length;
    const name=new Date(d+'T00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'short'});
    return `<section class="wday ${d===t?'today':''}"><h3><span>${name}${d===t?' · Heute':''}</span><span>${l.length?open+' offen':''}</span></h3>
      ${l.length?l.map(x=>itemRow(x,false)).join(''):'<div class="none">Frei</div>'}
      ${addDay===d?`<form class="wform" data-d="${d}"><input id="wadd" placeholder="Neue Aufgabe für diesen Tag…" autocomplete="off"></form>`:''}
      <button class="wadd" data-wadd="${d}">${addDay===d?'Abbrechen':'＋ Aufgabe'}</button></section>`;
  }).join('');
  document.getElementById('list').innerHTML=h;
  const i=document.getElementById('wadd');if(i)i.focus();
}
function noteTitle(n){const l=n.text.split('\n').find(x=>x.trim());return l?l.trim():'Neue Notiz'}
function notePreview(n){const ls=n.text.split('\n').filter(x=>x.trim());return ls.slice(1).join(' ').trim()}
function renderNoteList(){
  const q=noteQ.trim().toLowerCase();
  const l=notes.filter(n=>!q||n.text.toLowerCase().includes(q)).sort((a,b)=>b.upd-a.upd);
  document.getElementById('nlist').innerHTML=l.length?l.map(n=>`<button class="nrow" data-nopen="${n.id}"><b>${esc(noteTitle(n))}</b><span>${esc(notePreview(n))||'Kein weiterer Text'}</span><small>${new Date(n.upd).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</small></button>`).join(''):`<div class="empty">${notes.length?'Keine Treffer.':'Noch keine Notizen.<br>Lege unten die erste an.'}</div>`;
}
function renderNotes(){
  if(openNote!==null){
    const n=notes.find(x=>x.id===openNote);if(!n){openNote=null;return renderNotes()}
    document.getElementById('list').innerHTML=`<div class="ned"><button data-nback="1">‹ Notizen</button><button class="nd" data-ndel="1">${confirmDel?'Wirklich löschen?':'Löschen'}</button></div><textarea id="ntext" placeholder="Notiz schreiben… Die erste Zeile ist der Titel."></textarea>`;
    const t=document.getElementById('ntext');t.value=n.text;if(!n.text)t.focus();
    return;
  }
  document.getElementById('list').innerHTML=`<input id="nsearch" type="search" placeholder="Notizen durchsuchen…" autocomplete="off"><div id="nlist"></div>`;
  document.getElementById('nsearch').value=noteQ;
  renderNoteList();
}
function renderShop(){
  const open=shop.filter(x=>!x.done),done=shop.filter(x=>x.done);
  const row=x=>`<div class="item ${x.done?'done':''}"><button class="chk" data-sdone="${x.id}">${x.done?'✓':''}</button><div class="t"><div>${esc(x.name)}</div></div><button class="del" data-sdel="${x.id}" aria-label="Löschen">×</button></div>`;
  document.getElementById('list').innerHTML=shop.length?open.map(row).join('')+done.map(row).join('')+(done.length?`<button class="clear" data-sclear="1">Erledigte entfernen (${done.length})</button>`:''):'<div class="empty">Die Einkaufsliste ist leer 🛒</div>';
}
function render(){
  renderBanner();
  const hb=tab==='habits',sb=tab==='shop',wk=tab==='woche',nt=tab==='notizen';
  document.getElementById('f').hidden=hb||sb||wk||nt;document.getElementById('nf').hidden=!(nt&&openNote===null);document.getElementById('hf').hidden=!hb;document.getElementById('sf').hidden=!sb;
  document.getElementById('sub').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+' · '+tasks.filter(x=>!x.done).length+' offen';
  document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${n}</button>`).join('');
  if(hb){renderHabits();return}
  if(sb){renderShop();return}
  if(wk){renderWeek();return}
  if(nt){renderNotes();return}
  const l=visible();
  document.getElementById('list').innerHTML=l.length?l.map(x=>itemRow(x,true)).join(''):'<div class="empty">Nichts zu tun 🎉</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;openNote=null;confirmDel=false}
  else if(b.dataset.done){toggleTask(b.dataset.done)}
  else if(b.dataset.hday){const[id,d]=b.dataset.hday.split('|');const h=habits.find(x=>x.id==id);h.days=h.days.includes(d)?h.days.filter(x=>x!==d):[...h.days,d];saveH()}
  else if(b.dataset.aok){alerts=alerts.filter(i=>i!=b.dataset.aok)}
  else if(b.dataset.asnz){const x=tasks.find(t=>t.id==b.dataset.asnz);if(x){x.reminded=false;x.snoozeUntil=Date.now()+600000;save()}alerts=alerts.filter(i=>i!=b.dataset.asnz)}
  else if(b.dataset.perm){try{Promise.resolve(Notification.requestPermission()).then(()=>renderBanner()).catch(()=>{permBlocked=true;renderBanner()})}catch(e){permBlocked=true}}
  else if(b.dataset.nopen){openNote=+b.dataset.nopen;confirmDel=false}
  else if(b.dataset.nback){const n=notes.find(x=>x.id===openNote);if(n&&!n.text.trim()){notes=notes.filter(x=>x!==n);saveN()}openNote=null;confirmDel=false}
  else if(b.dataset.ndel){if(!confirmDel){confirmDel=true}else{notes=notes.filter(x=>x.id!==openNote);saveN();openNote=null;confirmDel=false}}
  else if(b.dataset.wk){weekOffset=b.dataset.wk==='reset'?0:weekOffset+(+b.dataset.wk)}
  else if(b.dataset.wadd){addDay=addDay===b.dataset.wadd?null:b.dataset.wadd}
  else if(b.dataset.sdone){const x=shop.find(t=>t.id==b.dataset.sdone);x.done=!x.done;saveS()}
  else if(b.dataset.sdel){shop=shop.filter(t=>t.id!=b.dataset.sdel);saveS()}
  else if(b.dataset.sclear){shop=shop.filter(t=>!t.done);saveS()}
  else if(b.dataset.hdel){habits=habits.filter(x=>x.id!=b.dataset.hdel);saveH()}
  else if(b.dataset.del){tasks=tasks.filter(t=>t.id!=b.dataset.del);save()}
  else return;
  render();
});
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  const title=document.getElementById('title').value.trim();if(!title)return;
  tasks.push({id:Date.now(),title,date:document.getElementById('date').value||(document.getElementById('rem').value!==''?today():''),time:document.getElementById('time').value,rem:document.getElementById('rem').value,reminded:false,prio:+document.getElementById('prio').value,cat:document.getElementById('cat').value,rep:document.getElementById('rep').value,done:false});
  save();document.getElementById('title').value='';document.getElementById('time').value='';document.getElementById('rem').value='';document.getElementById('time').required=false;checkReminders();render();
});
document.getElementById('hf').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('hname').value.trim();if(!name)return;
  habits.push({id:Date.now(),name,days:[]});saveH();document.getElementById('hname').value='';render();
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('.wform');if(!f)return;
  e.preventDefault();
  const title=f.querySelector('input').value.trim();if(!title)return;
  tasks.push({id:Date.now(),title,date:f.dataset.d,prio:3,cat:'Privat',rep:'',done:false});
  save();render();
});
document.getElementById('nf').addEventListener('submit',e=>{
  e.preventDefault();
  const n={id:Date.now(),text:'',upd:Date.now()};notes.push(n);saveN();openNote=n.id;confirmDel=false;render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='ntext'){const n=notes.find(x=>x.id===openNote);if(n){n.text=e.target.value;n.upd=Date.now();saveN()}}
  else if(e.target.id==='nsearch'){noteQ=e.target.value;renderNoteList()}
});
document.getElementById('rem').addEventListener('change',e=>{document.getElementById('time').required=e.target.value!==''});
setInterval(checkReminders,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
checkReminders();
document.getElementById('sf').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('sname').value.trim();if(!name)return;
  shop.push({id:Date.now(),name,done:false});saveS();document.getElementById('sname').value='';
  render();document.getElementById('sname').focus();
});
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
