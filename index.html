<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essen">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Mein Alltag</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top" class="wrap"><div><div id="crumb"></div><h1 id="h1"></h1><div class="sub" id="sub"></div></div></header>
<main id="view" class="wrap"></main>
<button id="fab" aria-label="Neu"></button>
<nav id="bar" aria-label="Hauptmenü"></nav>
<div id="toast" hidden><span id="tmsg"></span><button id="tundo">Rückgängig</button></div>

<div id="sheet" hidden>
  <div class="bd" data-close="1"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="grab"></div>
    <div class="shead"><b id="sh-title"></b><button type="button" data-close="1" aria-label="Schließen" id="sh-x"></button></div>
<form id="tplform" autocomplete="off" hidden>
      <p class="hint" style="margin:0 0 6px">Wähle Rezepte aus. Du kannst sie danach beliebig ändern.</p>
      <div id="tpl-list"></div>
      <div class="acts"><button type="button" id="tpl-all" data-tplall="1">Alle auswählen</button><button type="submit" class="ok" id="tpl-ok">Hinzufügen</button></div>
    </form>
<form id="mform" autocomplete="off" hidden>
      <div class="lbl" style="margin-top:4px">Wann</div>
      <div class="two"><input id="m-date" type="date" required aria-label="Datum"><select id="m-slot" aria-label="Mahlzeit"><option value="F">Frühstück</option><option value="M">Mittagessen</option><option value="A">Abendessen</option></select></div>
      <div class="lbl">Gericht</div>
      <input id="m-q" type="text" placeholder="Rezept suchen oder Gericht eintippen" aria-label="Gericht" enterkeyhint="done">
      <div id="m-pick"></div>
      <div class="acts"><button type="button" class="del" id="m-del" data-mdel="1">Löschen</button><button type="submit" class="ok">Speichern</button></div>
    </form>
<form id="rform" autocomplete="off" hidden>
      <input id="r-name" type="text" placeholder="Rezeptname, z. B. Tomatensuppe" required>
      <div class="lbl">Küche</div>
      <select id="r-cuisine" aria-label="Küche"></select>
      <div class="lbl">Aus einem Kochbuch? (optional)</div>
      <div class="two"><input id="r-book" type="text" list="r-booklist" placeholder="Kochbuch" aria-label="Kochbuch" autocomplete="off"><input id="r-page" type="text" inputmode="numeric" placeholder="Seite" aria-label="Seite" autocomplete="off"></div>
      <datalist id="r-booklist"></datalist>
      <div class="lbl">Portionen</div>
      <input id="r-port" type="number" min="1" max="50" inputmode="numeric" value="2" aria-label="Portionen">
      <div class="lbl">Zutaten</div>
      <p class="hint" style="margin:0 0 6px">„Kaufen“ heißt: unbedingt besorgen. „Vorrat“ heißt: hast du wahrscheinlich zu Hause.</p>
      <div id="r-ings"></div>
      <input id="r-iname" type="text" placeholder="Zutat suchen oder tippen, z. B. Tomate" aria-label="Zutat" style="margin-top:10px" enterkeyhint="done">
      <div class="sug" id="r-sug"></div>
      <div class="two3"><input id="r-iq" type="number" step="any" inputmode="decimal" placeholder="Menge" aria-label="Menge"><select id="r-iu" aria-label="Einheit"></select><button type="button" class="btn main" id="r-iadd" data-radd="1">Hinzufügen</button></div>
      <div class="lbl">Zubereitung (optional)</div>
      <textarea id="r-note" class="ta" rows="4" placeholder="Kurze Notizen zum Rezept" aria-label="Zubereitung"></textarea>
      <div class="acts"><button type="button" class="del" id="r-del" data-rdel="1">Löschen</button><button type="submit" class="ok">Speichern</button></div>
    </form>
  </div>
</div>
<input type="file" id="bfile" accept="application/json,.json" hidden>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
